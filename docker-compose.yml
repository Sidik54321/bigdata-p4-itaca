services:
  postgres:
    image: postgres:16
    container_name: bigdata-p4-postgres
    environment:
      POSTGRES_USER: bigdata
      POSTGRES_PASSWORD: bigdata
      POSTGRES_DB: itaca
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - bigdata-net

volumes:
  postgres-data:

networks:
  bigdata-net:
    driver: bridge
